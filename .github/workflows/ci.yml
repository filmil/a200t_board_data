# SPDX-License-Identifier: Apache-2.0
# Every push and every pull request: build the document and check the
# data against the facts established elsewhere.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: bazel-${{ runner.os }}-
      - name: Build
        run: bazelisk build //...
      - name: Test
        run: bazelisk test //... --test_output=errors
      - name: Keep the document
        uses: actions/upload-artifact@v4
        with:
          name: a200t-pdf
          path: bazel-bin/doc/a200t.pdf
